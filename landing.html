<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Core Labs | Coming Soon</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;700;800&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050810;
            --accent-blue: #3B82F6;
            --accent-purple: #8B5CF6;
            --text-white: #FFFFFF;
            --text-gray: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-white);
            font-family: 'Gothic A1', 'Noto Sans KR', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Background */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            overflow: hidden;
            pointer-events: none;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: move 20s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: var(--accent-blue);
            top: -100px;
            right: -100px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: var(--accent-purple);
            bottom: -100px;
            left: -100px;
            animation-duration: 25s;
            animation-delay: -5s;
        }

        @keyframes move {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(-50px, 50px) scale(1.1); }
        }

        /* Content Container (Lifted slightly for optical center balance) */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 900px;
            padding: 0 20px;
            transform: translateY(-5vh);
        }

        /* Logo Animation */
        .logo-container {
            margin-bottom: 24px;
            position: relative;
            display: inline-block;
        }

        .main-logo {
            height: 240px;
            filter: contrast(110%) drop-shadow(0 0 40px rgba(59, 130, 246, 0.6));
            animation: pulse 4s infinite ease-in-out;
            mix-blend-mode: screen;
            -webkit-mask-image: radial-gradient(circle, black 30%, transparent 65%);
            mask-image: radial-gradient(circle, black 30%, transparent 65%);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 40px rgba(59, 130, 246, 0.6)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 60px rgba(139, 92, 246, 0.8)); }
        }

        /* Typography */
        h1 {
            font-size: 80px;
            font-weight: 800;
            letter-spacing: -3px;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #FFFFFF 0%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .slogan {
            font-size: 27px;
            font-weight: 300;
            color: var(--text-gray);
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .highlight {
            color: var(--accent-blue);
            font-weight: 700;
        }

        .description {
            font-size: 18px;
            color: #64748B;
            margin-bottom: 36px;
            font-weight: 400;
        }

        /* Coming Soon Badge */
        .coming-soon {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 30px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #10B981;
            border-radius: 50%;
            box-shadow: 0 0 10px #10B981;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status-text {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 2px;
            color: #E2E8F0;
        }

        /* Site Footer */
        .site-footer {
            position: absolute;
            bottom: 28px;
            width: 100%;
            text-align: center;
            z-index: 10;
            font-size: 13px;
            color: #64748B;
            line-height: 1.6;
            padding: 0 20px;
        }

        .site-footer a {
            color: #94A3B8;
            text-decoration: none;
            border-bottom: 1px dotted #475569;
            transition: all 0.2s;
        }

        .site-footer a:hover {
            color: #38BDF8;
            border-bottom-color: #38BDF8;
        }

        /* Responsive */
        @media (max-width: 768px) {
            h1 { font-size: 44px; letter-spacing: -1px; margin-bottom: 12px; }
            .slogan { font-size: 19px; }
            .main-logo { height: 130px; }
            .logo-container { margin-bottom: 18px; }
            .description { margin-bottom: 28px; font-size: 15px; }
            .content { transform: translateY(-3vh); padding: 0 16px; }
            .site-footer { bottom: 18px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <div class="content">
        <div class="logo-container">
            <img src="logo_final.png" alt="Trinity Core Labs" class="main-logo">
        </div>
        
        <h1>Trinity Core Labs</h1>
        
        <p class="slogan">
            An Agile AI Studio <span class="highlight">Making the Impossible Possible</span>
        </p>
        
        <p class="description">
            Transforming bold ideas into "Institutional-Grade" realities.
        </p>

        <div class="coming-soon">
            <div class="dot"></div>
            <span class="status-text">COMING SOON</span>
        </div>
    </div>

    <footer class="site-footer">
        <p style="margin-bottom: 4px;">
            Inquiries: <a href="mailto:contact@trinitycorelabs.com">contact@trinitycorelabs.com</a>
        </p>
        <p style="color: #475569; font-size: 12px;">
            &copy; 2026 Trinity Core Labs. All rights reserved.
        </p>
    </footer>
</body>
</html>
