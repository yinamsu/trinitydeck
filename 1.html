<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trinity Labs Pitch Deck - Slide 1</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;800&family=Gothic+A1:wght@300;400;500;700;800&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100dvh;
            background-color: #050810; color: #FFFFFF;
            font-family: 'Noto Sans KR', sans-serif; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        .slide-container {
            width: 1280px; height: 720px;
            position: relative; flex-shrink: 0;
            transform-origin: center;
            background-color: #050810;
        }
        .nav-btn {
            position: fixed; top: 50%; transform: translateY(-50%);
            width: 60px; height: 60px; background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #FFFFFF; font-size: 24px; cursor: pointer; z-index: 10000;
            text-decoration: none; transition: all 0.3s ease;
        }
        .nav-btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3B82F6; }
        .prev-btn { left: 30px; }
        .next-btn { right: 30px; }
        .nav-btn.hidden { display: none; }

        /* Visit Button Style & Animation */
        .visit-btn {
            color: #FFFFFF !important;
            text-decoration: none;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(59, 130, 246, 0.25);
            padding: 8px 18px;
            border-radius: 20px;
            border: 1px solid rgba(59, 130, 246, 0.5);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            animation: heartbeat-glow 2s infinite ease-in-out;
            cursor: pointer;
        }
        .visit-btn:hover {
            transform: scale(1.05);
            background: rgba(59, 130, 246, 0.35);
            box-shadow: 0 0 25px rgba(59, 130, 246, 0.7);
            border-color: rgba(59, 130, 246, 0.8);
        }
        .visit-btn.gfex-btn {
            background: rgba(139, 92, 246, 0.25);
            border-color: rgba(139, 92, 246, 0.5);
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            animation-name: heartbeat-glow-purple;
        }
        .visit-btn.gfex-btn:hover {
            background: rgba(139, 92, 246, 0.35);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.7);
            border-color: rgba(139, 92, 246, 0.8);
        }

        @keyframes heartbeat-glow {
            0% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 25px rgba(59, 130, 246, 0.7); }
            100% { box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        }
        @keyframes heartbeat-glow-purple {
            0% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
            50% { box-shadow: 0 0 25px rgba(139, 92, 246, 0.7); }
            100% { box-shadow: 0 0 15px rgba(139, 92, 246, 0.4); }
        }
    </style>
</head>
<body>
    
    <a href="2.html" class="nav-btn next-btn"><i class="fas fa-chevron-right"></i></a>
    
    <div class="slide-container"
                style="position: relative; width: 1280px; height: 720px; overflow: hidden; background-color: #050810; font-family: 'Noto Sans KR', sans-serif;">
                <!-- Background Ambient Shapes -->
                <div data-object="true" data-object-type="shape"
                    style="position: absolute; left: 750px; top: -250px; width: 900px; height: 900px; border-radius: 50%; background-color: rgba(59, 130, 246, 0.04); z-index: 1;">
                </div>
                <div data-object="true" data-object-type="shape"
                    style="position: absolute; left: -250px; top: 350px; width: 700px; height: 700px; border-radius: 50%; background-color: rgba(139, 92, 246, 0.04); z-index: 1;">
                </div>
                <!-- Eyebrow Subtext -->
                <div data-object="true" data-object-type="textbox"
                    style="position: absolute; left: 140px; top: 140px; width: 1000px; height: 30px; z-index: 10;">
                    <p
                        style="margin: 0; padding: 0; text-align: center; color: #94A3B8; font-size: 15px; font-weight: 500; letter-spacing: 4px; font-family: 'Gothic A1', sans-serif;">
                        SEED PITCH DECK | AI · DATA INTELLIGENCE · WEB3 INFRASTRUCTURE</p>
                </div>
                <!-- Main Visual / Title Section -->
                <div data-object="true" data-object-type="textbox"
                    style="position: absolute; left: 0; top: 210px; width: 1280px; height: 120px; z-index: 10;">
                    <p
                        style="margin: 0; padding: 0; text-align: center; color: #FFFFFF; font-size: 80px; font-weight: 800; letter-spacing: -3px; font-family: 'Gothic A1', sans-serif;">
                        Trinity Labs</p>
                </div>

                <div data-object="true" data-object-type="textbox"
                    style="position: absolute; left: 140px; top: 400px; width: 1000px; height: 80px; z-index: 10;">
                    <div
                        style="width: 50px; height: 3px; background-color: #3B82F6; margin: 0 auto 30px auto; border-radius: 2px;">
                    </div>
                    <p
                        style="margin: 0; padding: 0; text-align: center; color: #E2E8F0; font-size: 32px; font-weight: 500; letter-spacing: -0.5px; font-family: 'Noto Sans KR', sans-serif; word-break: keep-all;">
                        AI를 도구 삼아 <span style="color: #60A5FA; font-weight: 700;">불가능을 가능케 하는 3인의 마스터</span></p>
                </div>

                <div data-object="true" data-object-type="textbox"
                    style="position: absolute; left: 140px; top: 540px; width: 1000px; height: 60px; z-index: 10;">
                    <p
                        style="margin: 0; padding: 0; text-align: center; color: #94A3B8; font-size: 20px; font-weight: 400; line-height: 1.6; font-family: 'Noto Sans KR', sans-serif; word-break: keep-all;">
                        아이디어 단계의 서비스를 <span style="color: #F8FAFC; font-weight: 700;">'기관급' 품질</span>로 양산하는 고효율 빌더 그룹
                    </p>
                </div>

            </div>

    <script>
        (function() {
            function scaleDeck() {
                const container = document.querySelector('.slide-container');
                const winWidth = window.innerWidth;
                const winHeight = window.innerHeight;
                const isPortrait = winHeight > winWidth;
                let scale;
                
                if (isPortrait && winWidth < 768) {
                    scale = (winWidth / 1280) * 0.92;
                } else if (winHeight < 500) {
                    scale = Math.min(winWidth / 1280, winHeight / 720) * 0.88; 
                } else {
                    scale = Math.min(winWidth / 1280, winHeight / 720) * 0.95;
                }
                if (container) container.style.transform = `scale(${scale})`;
            }
            window.addEventListener('resize', scaleDeck);
            scaleDeck();
        })();
    </script>
</body>
</html>
